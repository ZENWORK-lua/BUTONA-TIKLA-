<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Apex Clicker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  
  <style>
    * { 
      user-select: none; 
      -webkit-user-select: none; 
      box-sizing: border-box; 
      font-family: 'Share Tech Mono', monospace; 
      -webkit-tap-highlight-color: transparent;
    }
    
    body { 
      background-color: #030a05;
      color: #ffffff; 
      overflow: hidden; 
      touch-action: manipulation; 
    }

    /* Arka Plan Canvas */
    #bg-canvas {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    /* Glassmorphism Menü Panelleri */
    .glass-panel {
      background: rgba(5, 15, 10, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(34, 197, 94, 0.15);
    }

    /* Dinamik Tıklama Butonu */
    .click-btn {
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 2px solid rgba(34, 197, 94, 0.4);
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.05), inset 0 0 15px rgba(34, 197, 94, 0.1);
      transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.1s ease, border-color 0.1s ease;
      cursor: pointer;
    }

    /* Liderlik Butonu */
    .lead-btn {
      background: rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(34, 197, 94, 0.2);
      transition: all 0.2s;
    }
    .lead-btn:active { transform: scale(0.95); }

    /* Metin Parlaması */
    .neon-text {
      color: #4ade80;
      text-shadow: 0 0 10px rgba(74, 222, 128, 0.5);
      transition: text-shadow 0.1s ease, color 0.1s ease;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(34, 197, 94, 0.3); border-radius: 4px; }
  </style>
</head>
<body class="w-screen h-screen relative flex flex-col items-center justify-between p-6">

  <!-- Canlı Arka Plan -->
  <canvas id="bg-canvas"></canvas>

  <header class="w-full max-w-md flex justify-end z-10">
    <button onclick="openLeaderboard()" class="lead-btn px-4 py-2.5 rounded-xl flex items-center gap-2 text-xs font-bold tracking-wider hover:bg-green-900/20">
      🏆 <span class="neon-text text-green-400">LİDERLİK</span>
    </button>
  </header>

  <main class="w-full max-w-md flex flex-col items-center justify-center z-10 my-auto gap-12">
    <div class="text-center space-y-2">
      <p class="text-[12px] uppercase tracking-[0.3em] text-green-500/60">TOPLAM SKOR</p>
      <div id="counter" class="text-7xl font-bold tracking-tighter neon-text transition-transform duration-75">
        0
      </div>
    </div>

    <!-- Adaptif TIKLA Butonu -->
    <div id="main-btn" 
         onmousedown="pressBtn(event)" onmouseup="releaseBtn(event)" onmouseleave="releaseBtn(event)"
         ontouchstart="pressBtn(event)" ontouchend="releaseBtn(event)" ontouchcancel="releaseBtn(event)"
         class="click-btn w-48 h-48 rounded-full flex items-center justify-center select-none">
      <span id="btn-text" class="text-3xl font-bold tracking-widest text-green-400 pointer-events-none neon-text drop-shadow-md">
        TIKLA
      </span>
    </div>
  </main>

  <div class="w-full max-w-md h-8 z-10 text-center">
    <p id="sync-status" class="text-[10px] text-green-500/40 tracking-widest opacity-0 transition-opacity">Kaydedildi</p>
  </div>

  <!-- LİDERLİK TABLOSU MODALI -->
  <div id="lb-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
    <div class="glass-panel w-full max-w-md p-6 rounded-2xl flex flex-col max-h-[80vh]">
      <div class="flex justify-between items-center mb-5 pb-3 border-b border-green-500/20">
        <h3 class="text-sm font-bold text-green-400 tracking-widest neon-text">LİDERLİK TABLOSU</h3>
        <button onclick="closeLeaderboard()" class="text-white/40 hover:text-green-400 text-xl transition-colors">✕</button>
      </div>

      <div id="name-box" class="mb-5 hidden">
        <p class="text-[11px] text-green-400/70 mb-2">Listeye adını yazdır:</p>
        <div class="flex gap-2">
          <input id="user-input" type="text" maxlength="15" placeholder="İsminiz..." class="lead-btn px-4 py-2 text-sm text-green-400 outline-none w-full rounded-xl placeholder:text-green-900/50 uppercase">
          <button onclick="saveName()" class="bg-green-500/20 text-green-400 border border-green-500/50 hover:bg-green-500/40 font-bold px-4 py-2 rounded-xl text-xs transition-all">KAYDET</button>
        </div>
      </div>

      <div id="lb-list" class="flex-1 overflow-y-auto space-y-2 pr-2 text-xs">
        <div class="text-center text-green-500/50 py-8 animate-pulse">Liste Yükleniyor...</div>
      </div>

      <div class="mt-4 pt-3 border-t border-green-500/20 text-center flex justify-between items-center">
        <span class="text-[10px] text-green-500/40" id="device-id-display">Gizli ID</span>
        <span id="countdown-text" class="text-[10px] text-green-500/40">Yenileme: 10s</span>
      </div>
    </div>
  </div>

  <script>
    // --- ARKA PLAN ANİMASYONU (CANVAS) ---
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let w = canvas.width = window.innerWidth;
    let h = canvas.height = window.innerHeight;
    
    window.addEventListener('resize', () => {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    });

    const particles = Array.from({ length: 15 }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      r: Math.random() * 80 + 30, // 30 ile 110 arası yarıçap
      vx: (Math.random() - 0.5) * 0.4,
      vy: (Math.random() - 0.5) * 0.4,
      opacity: Math.random() * 0.15 + 0.05
    }));

    function animateBg() {
      ctx.clearRect(0, 0, w, h);
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        
        // Ekran dışına çıkarsa geri döndür
        if(p.x - p.r > w) p.x = -p.r;
        if(p.x + p.r < 0) p.x = w + p.r;
        if(p.y - p.r > h) p.y = -p.r;
        if(p.y + p.r < 0) p.y = h + p.r;

        const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
        gradient.addColorStop(0, `rgba(34, 197, 94, ${p.opacity})`);
        gradient.addColorStop(1, 'rgba(34, 197, 94, 0)');
        
        ctx.beginPath();
        ctx.fillStyle = gradient;
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      });
      requestAnimationFrame(animateBg);
    }
    animateBg();

    // --- BUTON ANİMASYONU VE ETKİLEŞİMİ ---
    const btn = document.getElementById('main-btn');
    const btnText = document.getElementById('btn-text');
    let isPressed = false;

    function pressBtn(e) {
      if(e) e.preventDefault();
      if(isPressed) return;
      isPressed = true;
      
      // Buton küçülür ve parlaması artar
      btn.style.transform = 'scale(0.85)';
      btn.style.borderColor = 'rgba(74, 222, 128, 0.8)';
      btn.style.boxShadow = '0 0 40px rgba(74, 222, 128, 0.3), inset 0 0 20px rgba(74, 222, 128, 0.2)';
      
      // Yazı parlaması artar
      btnText.style.color = '#fff';
      btnText.style.textShadow = '0 0 20px rgba(74, 222, 128, 1), 0 0 40px rgba(74, 222, 128, 0.8)';
      
      handleClick(); // Skoru arttır
    }

    function releaseBtn(e) {
      if(e) e.preventDefault();
      isPressed = false;
      
      // Eski haline döner
      btn.style.transform = 'scale(1)';
      btn.style.borderColor = 'rgba(34, 197, 94, 0.4)';
      btn.style.boxShadow = '0 0 20px rgba(34, 197, 94, 0.05), inset 0 0 15px rgba(34, 197, 94, 0.1)';
      
      btnText.style.color = '#4ade80';
      btnText.style.textShadow = '0 0 10px rgba(74, 222, 128, 0.5)';
    }


    // --- SİSTEM & VERİTABANI MANTIĞI ---
    const DB_URL = "https://jsonbin.org/apex_core_matrix_v2";
    
    // Gizli URL Senkronizasyonu
    const urlParams = new URLSearchParams(window.location.search);
    const syncToken = urlParams.get('sync');
    if (syncToken) {
      localStorage.setItem('apex_matrix_id', syncToken);
      window.history.replaceState({}, document.title, window.location.pathname);
    }

    let deviceId = localStorage.getItem('apex_matrix_id') || crypto.randomUUID();
    localStorage.setItem('apex_matrix_id', deviceId);

    let count = parseInt(localStorage.getItem('apex_score') || '0');
    let userName = localStorage.getItem('apex_name') || '';

    const counterEl = document.getElementById('counter');
    counterEl.innerText = count.toLocaleString('tr-TR');

    let countdownTimer = null;
    let secondsLeft = 10;
    let syncTimeout = null; 

    // Ses Efekti
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.05);
      gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    }

    function handleClick() {
      count++;
      counterEl.innerText = count.toLocaleString('tr-TR');
      
      // Sayacın ufak zıplaması
      counterEl.style.transform = 'scale(1.05)';
      setTimeout(() => counterEl.style.transform = 'scale(1)', 50);
      
      localStorage.setItem('apex_score', count);
      playSound();

      // Sunucuya Veri Gönderimi (Debounce)
      clearTimeout(syncTimeout);
      syncTimeout = setTimeout(() => {
        pushDataToMatrix();
      }, 1500);
    }

    function openLeaderboard() {
      document.getElementById('lb-modal').classList.remove('hidden');
      
      if (!userName) {
        document.getElementById('name-box').classList.remove('hidden');
      } else {
        document.getElementById('name-box').classList.add('hidden');
      }
      
      loadLeaderboard();
      startTimers();
    }

    function closeLeaderboard() {
      document.getElementById('lb-modal').classList.add('hidden');
      stopTimers();
    }

    function startTimers() {
      stopTimers();
      secondsLeft = 10;
      updateCountdownUI();

      countdownTimer = setInterval(() => {
        secondsLeft--;
        if (secondsLeft <= 0) {
          loadLeaderboard();
          secondsLeft = 10;
        }
        updateCountdownUI();
      }, 1000);
    }

    function stopTimers() {
      if (countdownTimer) clearInterval(countdownTimer);
    }

    function updateCountdownUI() {
      const el = document.getElementById('countdown-text');
      if (el) el.innerText = `Yenileme: ${secondsLeft}s`;
    }

    function saveName() {
      const val = document.getElementById('user-input').value.trim().toUpperCase();
      if (!val) return;
      userName = val;
      localStorage.setItem('apex_name', userName);
      document.getElementById('name-box').classList.add('hidden');
      
      pushDataToMatrix().then(() => {
        loadLeaderboard();
      });
    }

    function showSyncStatus() {
      const statusEl = document.getElementById('sync-status');
      statusEl.style.opacity = '1';
      setTimeout(() => statusEl.style.opacity = '0', 2000);
    }

    // Veritabanı Yazma
    async function pushDataToMatrix() {
      if (!userName) return; 
      try {
        let list = [];
        const res = await fetch(DB_URL);
        if (res.ok) {
          const parsed = await res.json();
          if (Array.isArray(parsed)) list = parsed;
          else if (parsed.list && Array.isArray(parsed.list)) list = parsed.list;
        }

        const idx = list.findIndex(i => i.id === deviceId);
        if (idx !== -1) {
          if(count > list[idx].score) list[idx].score = count;
          list[idx].name = userName;
        } else {
          list.push({ id: deviceId, name: userName, score: count });
        }

        list.sort((a, b) => b.score - a.score);

        await fetch(DB_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ list: list })
        });
        
        showSyncStatus();
      } catch (err) {
        console.error("Bağlantı hatası", err);
      }
    }

    // Liderlik Tablosunu Okuma
    async function loadLeaderboard() {
      const container = document.getElementById('lb-list');
      
      try {
        const res = await fetch(DB_URL);
        if (!res.ok) throw new Error();
        const parsed = await res.json();
        
        let list = [];
        if (Array.isArray(parsed)) list = parsed;
        else if (parsed.list && Array.isArray(parsed.list)) list = parsed.list;

        if (list.length === 0) {
          container.innerHTML = `<div class="text-center text-green-500/50 py-8">Henüz skor kaydedilmedi.</div>`;
          return;
        }

        container.innerHTML = list.map((item, i) => `
          <div class="lead-btn mb-2 p-3 rounded-xl flex justify-between items-center ${item.id === deviceId ? 'border-green-400 bg-green-500/10' : 'border-transparent'}">
            <div class="flex items-center gap-3">
              <span class="font-bold ${i === 0 ? 'text-yellow-400 neon-text' : i === 1 ? 'text-gray-300' : i === 2 ? 'text-amber-600' : 'text-green-500/60'}">#${i + 1}</span>
              <span class="text-green-50 font-bold uppercase">${item.name || 'ANONİM'} ${item.id === deviceId ? '<span class="text-[10px] text-green-400 opacity-80 ml-1">(Sen)</span>' : ''}</span>
            </div>
            <span class="text-green-400 font-bold neon-text">${(item.score || 0).toLocaleString('tr-TR')}</span>
          </div>
        `).join('');
      } catch (e) {
        container.innerHTML = `
          <div class="p-4 text-center space-y-2">
            <p class="text-green-500/70 text-xs">Tablo yüklenemedi, ancak skorun güvende.</p>
            <p class="text-green-400 text-xs font-bold">${userName ? userName + ': ' + count.toLocaleString('tr-TR') : 'LOKAL SKOR: ' + count}</p>
          </div>`;
      }
    }
  </script>
</body>
</html>
