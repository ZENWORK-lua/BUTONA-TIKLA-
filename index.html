<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Apex // Sıvı Cam Arayüzü</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      /* Varsayılan Tema: Kozmik Titreşim (Mor/Pembe) */
      --theme-rgb: 168, 85, 247; 
      --theme-glow: rgba(168, 85, 247, 0.4);
    }
    
    * { select-none: none; -webkit-user-select: none; box-sizing: border-box; }
    body { background-color: #02040a; color: #f3f4f6; overflow: hidden; touch-action: manipulation; font-family: system-ui, -apple-system, sans-serif; }

    /* --- UZAY / YILDIZ ARKA PLANI --- */
    #space-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }

    /* --- CAM / SIVI METERYAL (VISION OS STİLİ) --- */
    .glass-icon {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(24px) saturate(150%);
      -webkit-backdrop-filter: blur(24px) saturate(150%);
      border: 1px solid rgba(var(--theme-rgb), 0.3);
      box-shadow: inset 0 0 12px rgba(var(--theme-rgb), 0.1), 0 8px 24px rgba(0, 0, 0, 0.4);
      transition: all 0.3s ease;
    }
    .glass-icon:active { transform: scale(0.92); border-color: rgba(var(--theme-rgb), 0.8); }

    /* --- DİNAMİK ADA (ANA BUTON / PANEL) --- */
    #hero-island {
      background: radial-gradient(130% 130% at 50% 0%, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.01) 100%);
      backdrop-filter: blur(40px) saturate(180%);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
      border: 1px solid rgba(var(--theme-rgb), 0.4);
      box-shadow: 
        inset 0 1px 1px rgba(255, 255, 255, 0.2), 
        inset 0 -2px 10px rgba(var(--theme-rgb), 0.1), 
        0 10px 40px rgba(var(--theme-rgb), 0.2);
      transition: all 0.65s cubic-bezier(0.32, 0.72, 0, 1);
      position: relative;
      overflow: hidden;
    }

    /* Mod 1: Tıklama Dairesi */
    .island-circle {
      width: 14rem; height: 14rem;
      border-radius: 50%;
      cursor: pointer;
      display: flex; justify-content: center; align-items: center;
    }
    .island-circle:active {
      transform: scale(0.96);
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.2), inset 0 0 20px rgba(var(--theme-rgb), 0.3), 0 5px 20px rgba(var(--theme-rgb), 0.1);
    }

    /* Mod 2: Genişletilmiş Menü Dikdörtgeni */
    .island-panel {
      width: 22rem; min-height: 26rem;
      border-radius: 2rem;
      cursor: default;
      padding: 1.5rem;
      display: flex; flex-direction: column;
    }

    /* --- SAYACIN AŞAĞI YUMUŞAK KAYMASI --- */
    #counter-container {
      transition: transform 0.65s cubic-bezier(0.32, 0.72, 0, 1);
    }

    /* --- EFEKTLER --- */
    /* İkon Uçma Animasyonu */
    .flying-icon {
      position: fixed; z-index: 100;
      transition: transform 0.6s cubic-bezier(0.5, 0, 0.2, 1), opacity 0.6s;
    }

    /* Parıltı / Dalga (Shimmer) Efekti */
    .shimmer-wave {
      position: absolute; top: 0; left: -150%; width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transform: skewX(-20deg);
      pointer-events: none;
    }
    .animate-shimmer { animation: sweep 0.7s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
    @keyframes sweep { 100% { left: 200%; } }

    /* Temaların İçeri Akma Animasyonu (Staggered Fade) */
    .stagger-item {
      opacity: 0; transform: translateY(15px);
      animation: slideUpFade 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes slideUpFade { 
      to { opacity: 1; transform: translateY(0); } 
    }

    /* Özel Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(var(--theme-rgb), 0.5); border-radius: 4px; }
  </style>
</head>
<body class="w-screen h-screen relative flex justify-center">

  <canvas id="space-canvas"></canvas>

  <!-- ÜST SABİT BUTONLAR -->
  <div class="absolute top-8 w-full px-8 flex justify-between z-20 pointer-events-none max-w-md mx-auto">
    <!-- Liderlik (Orta-Sol) -->
    <button id="btn-leaderboard" onclick="triggerMorph(this, 'leaderboard')" class="glass-icon w-12 h-12 rounded-2xl flex items-center justify-center text-xl pointer-events-auto">
      🏆
    </button>
    <!-- Temalar (Orta-Sağ) -->
    <button id="btn-themes" onclick="triggerMorph(this, 'themes')" class="glass-icon w-12 h-12 rounded-2xl flex items-center justify-center text-xl pointer-events-auto">
      🎨
    </button>
  </div>

  <!-- MERKEZ ALAN (Buton ve Sayaç Flex Grubu) -->
  <main class="relative z-10 flex flex-col items-center justify-center h-full w-full max-w-md gap-6">
    
    <!-- Dinamik Ada (Tıklama Dairesi / Panel) -->
    <div id="hero-island" class="island-circle" onmousedown="handleMainClick()" ontouchstart="handleMainClick(event)">
      <!-- Sadece panel modunda görünecek içerik alanı -->
      <div id="island-content" class="w-full h-full hidden flex-col"></div>
      
      <!-- Merkezi Yıldırım/Güç İkonu (Daire modunda) -->
      <div id="hero-icon" class="text-6xl text-white drop-shadow-[0_0_15px_rgba(var(--theme-rgb),0.8)] pointer-events-none transition-opacity duration-300">
        ⚡
      </div>
    </div>

    <!-- Sayaç (Panel açılınca doğal olarak Flex ile aşağı kayar) -->
    <div id="counter-container" class="text-center transition-all">
      <div id="counter" class="text-[5rem] leading-none font-black font-mono tracking-tighter" style="text-shadow: 0 0 30px rgba(var(--theme-rgb), 0.6); color: rgb(var(--theme-rgb));">
        0
      </div>
      <p class="text-[10px] font-mono tracking-[0.3em] text-white/30 uppercase mt-2">Enerji Seviyesi</p>
    </div>

  </main>

  <!-- ALT SABİT BUTON (Sıfırlama) -->
  <div class="absolute bottom-10 w-full flex justify-center z-20 pointer-events-none">
    <button id="btn-reset" onclick="triggerMorph(this, 'reset')" class="glass-icon w-14 h-14 rounded-3xl flex items-center justify-center text-xl text-red-400 pointer-events-auto border-red-500/30">
      ⟲
    </button>
  </div>

  <!-- AutoClicker Uyarısı -->
  <div id="warning-box" class="absolute top-24 left-1/2 transform -translate-x-1/2 glass-icon bg-red-900/40 border-red-500/50 text-red-200 px-6 py-3 rounded-2xl text-xs font-mono z-50 hidden opacity-0 transition-opacity">
    SİSTEM KİLİTLENDİ: İnsanüstü Hız Algılandı!
  </div>

  <script>
    /* -------------------------------------------------------------------------- */
    /* 1. MİMARİ VE VERİ YÖNETİMİ */
    /* -------------------------------------------------------------------------- */
    const DB_URL = "https://kvdb.io/4y9X6p1kG9xN7Z3mQ8W2vL/apex_leaderboard";
    let deviceId = localStorage.getItem('apx_id') || crypto.randomUUID();
    localStorage.setItem('apx_id', deviceId);
    let count = parseInt(localStorage.getItem('apx_cnt') || '0');
    let userName = localStorage.getItem('apx_name') || '';
    
    let isPanelOpen = false;
    let clickTimestamps = [];
    let isBlocked = false;

    // Arayüz Elementleri
    const heroIsland = document.getElementById('hero-island');
    const heroIcon = document.getElementById('hero-icon');
    const islandContent = document.getElementById('island-content');
    const counterEl = document.getElementById('counter');
    counterEl.innerText = count.toLocaleString('tr-TR');

    const themes = [
      { id: '1', name: 'Kozmik Titreşim', rgb: '168, 85, 247', icon: '🌌' },
      { id: '2', name: 'Sıvı Zümrüt', rgb: '16, 185, 129', icon: '🌲' },
      { id: '3', name: 'Okyanus Yakamozu', rgb: '56, 189, 248', icon: '🌊' },
      { id: '4', name: 'Güneş Fırtınası', rgb: '245, 158, 11', icon: '☄️' },
      { id: '5', name: 'Buzul Ateşi', rgb: '226, 232, 240', icon: '❄️' },
      { id: '6', name: 'Karanlık Madde', rgb: '71, 85, 105', icon: '🌑' },
      { id: '7', name: 'Şeftali Bulutu', rgb: '251, 146, 60', icon: '🍑' },
      { id: '8', name: 'Sonsuzluk Yakutu', rgb: '225, 29, 72', icon: '♦️' }
    ];

    // Cihazın temasını yükle
    let currentTheme = localStorage.getItem('apx_theme') || '168, 85, 247';
    document.documentElement.style.setProperty('--theme-rgb', currentTheme);

    /* Ses Motoru (Sadece tıklama dairesiyken çalışır) */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playLiquidClick() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.05);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    }

    /* -------------------------------------------------------------------------- */
    /* 2. DİNAMİK ADA (MORPH) VE GÖRSEL FİZİK ANİMASYONLARI */
    /* -------------------------------------------------------------------------- */

    function triggerMorph(buttonEl, menuType) {
      if (isPanelOpen) return; // Zaten açıksa işlem yapma
      isPanelOpen = true;

      // 1. Uçan İkon Animasyonu
      const rect = buttonEl.getBoundingClientRect();
      const clone = buttonEl.cloneNode(true);
      clone.className = buttonEl.className + ' flying-icon';
      clone.style.left = rect.left + 'px';
      clone.style.top = rect.top + 'px';
      clone.style.margin = '0';
      document.body.appendChild(clone);

      // Ada merkezini bul
      const islandRect = heroIsland.getBoundingClientRect();
      const centerX = islandRect.left + (islandRect.width / 2) - (rect.width / 2);
      const centerY = islandRect.top + (islandRect.height / 2) - (rect.height / 2);

      // Frame atla ve animasyonu başlat
      requestAnimationFrame(() => {
        clone.style.transform = `translate(${centerX - rect.left}px, ${centerY - rect.top}px) rotate(720deg) scale(0.2)`;
        clone.style.opacity = '0';
      });

      // 2. İkon hedefe ulaştığında...
      setTimeout(() => {
        clone.remove();
        
        // Şimmer Efekti Tetikle
        const shimmer = document.createElement('div');
        shimmer.className = 'shimmer-wave animate-shimmer';
        heroIsland.appendChild(shimmer);
        setTimeout(() => shimmer.remove(), 700);

        // Adayı Genişlet (Morph)
        heroIcon.style.opacity = '0';
        heroIsland.classList.remove('island-circle');
        heroIsland.classList.add('island-panel');

        // İçeriği Gecikmeli Yükle
        setTimeout(() => {
          heroIcon.classList.add('hidden');
          islandContent.classList.remove('hidden');
          islandContent.classList.add('flex');
          renderMenu(menuType);
        }, 300); // Ada büyüme süresinin yarısında içeriği göster

      }, 600); // CSS transform süresi
    }

    function closePanel() {
      islandContent.classList.remove('flex');
      islandContent.classList.add('hidden');
      islandContent.innerHTML = '';
      
      heroIsland.classList.remove('island-panel');
      heroIsland.classList.add('island-circle');
      
      heroIcon.classList.remove('hidden');
      setTimeout(() => { heroIcon.style.opacity = '1'; }, 100);
      
      setTimeout(() => { isPanelOpen = false; }, 650);
    }

    /* -------------------------------------------------------------------------- */
    /* 3. MENÜ İÇERİKLERİNİN RENDER EDİLMESİ (Staggered Fade) */
    /* -------------------------------------------------------------------------- */

    function renderMenu(type) {
      let html = `<div class="flex justify-between items-center mb-4 border-b border-white/10 pb-2">
                    <h3 class="text-white/80 font-mono text-sm tracking-widest uppercase">`;

      if (type === 'themes') {
        html += `Mekan Teması</h3><button onclick="closePanel()" class="text-white/40 hover:text-white">✕</button></div>`;
        html += `<div class="flex-1 overflow-y-auto pr-2 space-y-2">`;
        
        // Temaları milisaniye gecikmeli (stagger) oluştur
        themes.forEach((t, index) => {
          const delay = index * 30; // Her biri 30ms daha geç gelir
          html += `
            <div onclick="applyTheme('${t.rgb}')" class="stagger-item flex items-center justify-between p-3 rounded-xl border border-white/5 bg-black/20 hover:bg-white/10 cursor-pointer transition-colors" style="animation-delay: ${delay}ms;">
              <div class="flex items-center gap-3">
                <span class="text-lg">${t.icon}</span>
                <span class="text-xs font-mono text-white/80">${t.name}</span>
              </div>
              <div class="w-4 h-4 rounded-full" style="background: rgb(${t.rgb}); box-shadow: 0 0 10px rgba(${t.rgb}, 0.8)"></div>
            </div>`;
        });
        html += `</div>`;
        islandContent.innerHTML = html;
      } 
      
      else if (type === 'reset') {
        html += `SİSTEM SIFIRLAMA</h3><button onclick="closePanel()" class="text-white/40 hover:text-white">✕</button></div>`;
        html += `
          <div class="flex-1 flex flex-col items-center justify-center text-center stagger-item" style="animation-delay: 50ms;">
            <p class="text-sm font-mono text-red-300 mb-6 px-4">Sayacı kalıcı olarak sıfırlamak istediğinize emin misiniz?</p>
            <div class="flex gap-3 w-full">
              <button onclick="executeReset()" class="flex-1 glass-icon bg-red-900/30 border-red-500/30 text-red-300 py-3 rounded-xl font-mono text-xs hover:bg-red-900/60">Evet, Sıfırla</button>
              <button onclick="closePanel()" class="flex-1 glass-icon bg-white/5 border-white/10 text-white/80 py-3 rounded-xl font-mono text-xs hover:bg-white/10">İptal</button>
            </div>
          </div>`;
        islandContent.innerHTML = html;
      }

      else if (type === 'leaderboard') {
        html += `KÜRESEL AĞ</h3><button onclick="closePanel()" class="text-white/40 hover:text-white">✕</button></div>`;
        
        // İsim girilmemişse
        if (!userName) {
          html += `
            <div class="flex flex-col gap-3 mt-4 stagger-item" style="animation-delay: 50ms;">
              <p class="text-xs font-mono text-white/50">Ağa katılmak için kimlik oluşturun:</p>
              <input id="lb-name" type="text" maxlength="15" placeholder="Siber Adınız..." class="w-full bg-black/30 border border-white/20 rounded-xl px-4 py-3 text-sm text-white outline-none focus:border-[rgba(var(--theme-rgb),1)] font-mono transition-colors">
              <button onclick="saveNameAndLoad()" class="w-full glass-icon bg-white/10 py-3 rounded-xl text-xs font-bold tracking-wider text-white">BAĞLAN</button>
            </div>`;
          islandContent.innerHTML = html;
        } else {
          // Liderlik Tablosunu Yükle
          islandContent.innerHTML = html + `<div id="lb-list" class="flex-1 overflow-y-auto space-y-2 pr-1"><p class="text-center text-white/30 text-xs font-mono mt-10 animate-pulse">Veritabanı Senkronize Ediliyor...</p></div>`;
          fetchLeaderboard();
        }
      }
    }

    function applyTheme(rgb) {
      document.documentElement.style.setProperty('--theme-rgb', rgb);
      localStorage.setItem('apx_theme', rgb);
      closePanel();
    }

    function executeReset() {
      count = 0;
      counterEl.innerText = "0";
      localStorage.setItem('apx_cnt', 0);
      syncToCloud();
      closePanel();
    }

    function saveNameAndLoad() {
      const v = document.getElementById('lb-name').value.trim();
      if (!v) return;
      userName = v;
      localStorage.setItem('apx_name', userName);
      renderMenu('leaderboard');
    }

    /* Güvenli ve Timeout Korumalı Liderlik Çekimi */
    async function fetchLeaderboard() {
      const container = document.getElementById('lb-list');
      try {
        // 3 Saniye Timeout Koruması
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 3000);
        
        const res = await fetch(DB_URL, { signal: controller.signal });
        clearTimeout(timeoutId);
        
        if (!res.ok) throw new Error("Ağ hatası");
        const list = await res.json();

        if (!list || list.length === 0) {
          container.innerHTML = `<p class="text-center text-white/30 text-xs font-mono mt-10">Ağ boş. İlk izi sen bırak.</p>`;
          return;
        }

        container.innerHTML = list.map((item, i) => {
          const delay = i * 20;
          return `
            <div class="stagger-item flex justify-between items-center p-3 bg-black/20 border border-white/5 rounded-xl ${item.id === deviceId ? 'border-[rgba(var(--theme-rgb),0.5)] bg-[rgba(var(--theme-rgb),0.1)]' : ''}" style="animation-delay: ${delay}ms;">
              <div class="flex items-center gap-3">
                <span class="font-bold text-xs ${i===0?'text-yellow-400':i===1?'text-gray-300':i===2?'text-amber-600':'text-white/30'}">#${i+1}</span>
                <span class="text-xs font-mono text-white/80">${item.name} ${item.id === deviceId ? '(Sen)' : ''}</span>
              </div>
              <span class="text-xs font-bold text-[rgb(var(--theme-rgb))]">${item.score.toLocaleString('tr-TR')}</span>
            </div>`;
        }).join('');

      } catch (e) {
        // KVDB başarısız olursa arayüz takılmasın, yerel veriyi göstersin
        container.innerHTML = `
          <div class="stagger-item p-3 bg-black/20 border border-white/5 rounded-xl mt-4">
            <p class="text-[10px] text-red-400 font-mono mb-2">Bulut bağlantısı koptu. Yerel veri gösteriliyor:</p>
            <div class="flex justify-between">
              <span class="text-xs text-white/80">${userName} (Sen)</span>
              <span class="text-xs text-[rgb(var(--theme-rgb))]">${count.toLocaleString('tr-TR')}</span>
            </div>
          </div>`;
      }
    }

    /* -------------------------------------------------------------------------- */
    /* 4. TIKLAMA, MAKRO KORUMASI VE BULUT SENKRONİZASYONU */
    /* -------------------------------------------------------------------------- */
    
    function handleMainClick(e) {
      if (e) e.preventDefault();
      if (isPanelOpen || isBlocked) return; // Panel açıksa sayaç artmaz

      const now = Date.now();
      clickTimestamps.push(now);
      clickTimestamps = clickTimestamps.filter(t => now - t < 1000);

      // 18 CPS Sınırı (AutoClicker/Makro)
      if (clickTimestamps.length > 18) {
        isBlocked = true;
        const warnBox = document.getElementById('warning-box');
        warnBox.classList.remove('hidden');
        setTimeout(() => warnBox.style.opacity = '1', 10);
        
        setTimeout(() => {
          warnBox.style.opacity = '0';
          setTimeout(() => { warnBox.classList.add('hidden'); isBlocked = false; clickTimestamps = []; }, 300);
        }, 5000);
        return;
      }

      count++;
      counterEl.innerText = count.toLocaleString('tr-TR');
      localStorage.setItem('apx_cnt', count);
      playLiquidClick();

      // Yıldız hızını artır
      particleSpeedMultiplier = Math.min(clickTimestamps.length * 1.5, 12);

      syncToCloud();
    }

    let syncTimer = null;
    function syncToCloud() {
      if (!userName) return;
      clearTimeout(syncTimer);
      syncTimer = setTimeout(async () => {
        try {
          let list = [];
          const res = await fetch(DB_URL);
          if (res.ok) list = await res.json();
          
          const index = list.findIndex(item => item.id === deviceId);
          if (index !== -1) {
            list[index].score = count;
            list[index].name = userName;
          } else {
            list.push({ id: deviceId, name: userName, score: count });
          }
      list.sort((a, b) => b.score - a.score);
          await fetch(DB_URL, { method: 'POST', body: JSON.stringify(list.slice(0, 50)) });
        } catch (e) {}
      }, 2500); // Tıklamalar bittikten 2.5 sn sonra senkronize et (sunucuyu yormamak için)
    }

    /* -------------------------------------------------------------------------- */
    /* 5. CANVAS - ADAPTİF UZAY / YILDIZ AKIŞI */
    /* -------------------------------------------------------------------------- */
    
    const canvas = document.getElementById('space-canvas');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    let stars = Array.from({ length: 150 }, () => ({
      x: (Math.random() - 0.5) * width * 2,
      y: (Math.random() - 0.5) * height * 2,
      z: Math.random() * width
    }));

    let particleSpeedMultiplier = 1;

    function renderSpace() {
      ctx.clearRect(0, 0, width, height);
      const cx = width / 2;
      const cy = height / 2;

      // Hız zamanla yavaşça normale (1) döner
      particleSpeedMultiplier = Math.max(1, particleSpeedMultiplier * 0.96);

      stars.forEach(s => {
        s.z -= 1.5 * particleSpeedMultiplier;
        if (s.z <= 0) { s.z = width; s.x = (Math.random() - 0.5) * width * 2; s.y = (Math.random() - 0.5) * height * 2; }

        const k = 128 / s.z;
        const px = s.x * k + cx;
        const py = s.y * k + cy;

        if (px >= 0 && px < width && py >= 0 && py < height) {
          const size = Math.max(0.5, (1 - s.z / width) * 2.5);
          const alpha = (1 - s.z / width) * 0.8;
          
          if (particleSpeedMultiplier > 2.5) {
            // Işık Hızı Çizgi Efekti
            const tailX = (s.x * (128 / (s.z + particleSpeedMultiplier * 6))) + cx;
            const tailY = (s.y * (128 / (s.z + particleSpeedMultiplier * 6))) + cy;
            ctx.beginPath();
            ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
            ctx.lineWidth = size * 0.8;
            ctx.lineCap = "round";
            ctx.moveTo(px, py);
            ctx.lineTo(tailX, tailY);
            ctx.stroke();
          } else {
            // Normal Yıldız
            ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
            ctx.beginPath();
            ctx.arc(px, py, size, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      });
      requestAnimationFrame(renderSpace);
    }
    renderSpace();
  </script>
</body>
</html>
